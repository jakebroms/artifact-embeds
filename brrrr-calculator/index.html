<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRRRR Deal Calculator</title>
<meta name="description" content="Price a buy-rehab-rent-refinance deal. Enter the numbers and see the max offer, cash left in after the refi, cash flow and DSCR update live. Inputs are saved in the URL so you can bookmark a deal.">
<style>
:root{
  color-scheme:light;
  --navy:#0B2A4A; --chathams:#143D6B; --ink:#0B2A4A; --mute:#5b6b7d; --faint:#8a98a8;
  --line:#dde6ef; --bg:#f4f7fb; --card:#fff; --soft:#eef3f9;
  --good:#1d7a4a; --good-bg:#e9f6ee; --good-line:#bfe3cc;
  --warn:#8a6d1f; --warn-bg:#fbf4e1; --warn-line:#ecd9a0;
  --bad:#8a2727;  --bad-bg:#fdf3f3;  --bad-line:#e6b9b9;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased;font-size:14px}
.num{font-variant-numeric:tabular-nums}

header{background:var(--navy);color:#fff;padding:18px 0}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
header h1{font-size:19px;font-weight:700;letter-spacing:.005em}
header p{color:#cfd9e6;font-size:12.5px;margin-top:3px;max-width:640px}
.btns{display:flex;gap:8px}
.btn{font:inherit;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:6px;cursor:pointer;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.primary{background:#fff;color:var(--navy);border-color:#fff}
.btn.primary:hover{background:#e8f0fb}

main{padding:18px 0 60px}
.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:18px;align-items:start}
.grid>*,.cols>*,.fields>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 1px 2px rgba(11,42,74,.04)}
.card+.card{margin-top:18px}
h3{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
section+section{margin-top:18px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.field label,.sel label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.ctl{display:flex;align-items:center;border:1px solid #c9d5e2;border-radius:6px;background:#fff}
.ctl:focus-within{outline:2px solid var(--chathams);outline-offset:-1px}
.ctl span{color:var(--faint);font-size:13px;padding:0 8px;user-select:none}
.ctl input{flex:1;min-width:0;width:100%;border:0;background:transparent;font:inherit;font-size:14px;padding:7px 8px;text-align:right;color:var(--ink)}
.ctl input:focus{outline:none}
.ctl input::-webkit-outer-spin-button,.ctl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ctl input[type=number]{-moz-appearance:textfield;appearance:textfield}
.hint{font-size:11px;color:var(--faint);margin-top:3px;line-height:1.35}
.sel{grid-column:1/-1}
.sel select{width:100%;min-width:0;max-width:100%;font:inherit;font-size:14px;padding:7px 8px;border:1px solid #c9d5e2;border-radius:6px;background:#fff;color:var(--ink)}
.foot{font-size:11px;color:var(--faint);border-top:1px solid var(--line);padding-top:10px;margin-top:18px;line-height:1.4}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.big{font-size:32px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--mute);margin-top:4px}
.badge{display:inline-block;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid}
.good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)} .neutral{color:var(--ink)}
.badge.good{background:var(--good-bg);border-color:var(--good-line)}
.badge.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.badge.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.badge.neutral{background:var(--soft);border-color:var(--line)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.tile{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.tile .v{font-size:18px;font-weight:700;line-height:1.2;margin-top:2px}
.tile .s{font-size:11px;color:var(--faint);line-height:1.3}
.note{margin-top:14px;padding:10px 12px;border-radius:8px;font-size:12.5px;line-height:1.45;border:1px solid}
.note.warn{background:var(--warn-bg);border-color:var(--warn-line);color:#5c4710}
.note.quiet{background:transparent;border-color:transparent;color:var(--mute);padding:0;margin-top:12px}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px}
table{width:100%;border-collapse:collapse}
td{padding:4px 0;font-size:13px;vertical-align:top}
td:first-child{color:var(--mute);font-size:12px;padding-right:12px;white-space:nowrap}
td:last-child{text-align:right;font-weight:500}
tr.indent td:first-child{padding-left:12px;color:var(--faint)}
tr.strong td{border-top:1px solid var(--line);font-weight:700}
tr.strong td:first-child{color:var(--ink);font-size:12.5px}

.sens{overflow-x:auto}
.sens table th{font-size:11px;color:var(--faint);font-weight:600;text-align:right;padding:4px 10px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.sens table th:first-child{text-align:left}
.sens table td{padding:6px 10px 6px 0;border-bottom:1px solid #eef2f6;white-space:nowrap}
.sens table td:first-child{color:var(--ink);font-size:13px}
.sens tr.base td{background:#eaf2fb;font-weight:600}
.sens .pct{color:var(--faint);font-size:11px;margin-left:4px}

.sticky{display:none}
@media (max-width:860px){
  .grid{grid-template-columns:1fr}
  .cols{grid-template-columns:1fr}
  .sticky{display:block;position:sticky;top:0;z-index:5;background:rgba(244,247,251,.95);backdrop-filter:blur(4px);padding:8px 0;margin:-6px 0 12px;border-bottom:1px solid var(--line)}
  .sticky .card{padding:9px 12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px}
  .sticky .big{font-size:20px}
  .sticky .mini{display:flex;gap:14px;font-size:11.5px}
  .sticky .mini b{display:block;font-size:13px}
  .sticky .mini span{color:var(--faint)}
}
@media (max-width:480px){
  .fields{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <div>
      <h1>BRRRR Deal Calculator</h1>
      <p>Buy, rehab, rent, refinance. Change any number and the max offer updates live. The URL carries your inputs, so bookmark it or hit Copy link to save a deal.</p>
    </div>
    <div class="btns">
      <button class="btn primary" id="copy" type="button">Copy link</button>
      <button class="btn" id="reset" type="button">Reset</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="sticky" id="sticky"></div>
    <div class="grid">
      <div class="card" id="inputs"></div>
      <div id="results"></div>
    </div>
  </div>
</main>

<script>
(function(){
'use strict';

// ── Defaults (mirror bbr-deal-bot/backend/app/config/defaults.py) ─────────────
// Percent fields are stored as whole numbers in the form and the URL.
const DEFAULTS = {
  price:80000, close:3000,
  rehab:40000, hold:6, carry:1200,
  arv:150000, ltv:75, rate:7.5, amort:30, reficlose:4000, dscr:1.2,
  rent:1275, vac:5, maint:8, capex:5, mgmt:8, ti:4800,
  maxleft:0,
  basis:'noi'
};
const PERCENT = new Set(['ltv','rate','vac','maint','capex','mgmt']);

const SECTIONS = [
  {title:'Buy', fields:[
    {k:'price', label:'Purchase price', unit:'$', step:1000},
    {k:'close', label:'Closing & acquisition costs', unit:'$', step:500, hint:'Assignment fee, attorney, title, transfer tax.'}
  ]},
  {title:'Rehab & hold', fields:[
    {k:'rehab', label:'Rehab budget', unit:'$', step:1000},
    {k:'hold', label:'Months until refi closes', unit:'mo', step:1, hint:'Rehab + lease-up + lender seasoning.'},
    {k:'carry', label:'Holding cost per month', unit:'$', step:100, hint:'Taxes, insurance, utilities, plus hard-money interest if financed.'}
  ]},
  {title:'Refinance', basis:true, fields:[
    {k:'arv', label:'After-repair value (appraisal)', unit:'$', step:1000},
    {k:'ltv', label:'Loan-to-value', unit:'%', step:1},
    {k:'rate', label:'Interest rate', unit:'%', step:0.125},
    {k:'amort', label:'Amortization', unit:'yr', step:5},
    {k:'reficlose', label:'Refi closing costs', unit:'$', step:500},
    {k:'dscr', label:'Lender minimum DSCR', unit:'×', step:0.05, hint:'Set to 0 to size the loan on LTV alone.'}
  ]},
  {title:'Rent', fields:[
    {k:'rent', label:'Monthly rent', unit:'$', step:25},
    {k:'vac', label:'Vacancy', unit:'%', step:1},
    {k:'maint', label:'Maintenance', unit:'%', step:1},
    {k:'capex', label:'CapEx reserve', unit:'%', step:1},
    {k:'mgmt', label:'Management', unit:'%', step:1},
    {k:'ti', label:'Taxes + insurance per year', unit:'$', step:100}
  ]},
  {title:'Target', fields:[
    {k:'maxleft', label:'Max cash left in deal', unit:'$', step:1000, hint:'$0 means a full BRRRR: the refi returns every dollar you put in.'}
  ]}
];

// ── Math ──────────────────────────────────────────────────────────────────────
function pmt(principal, annualRate, years){
  const n = Math.max(1, Math.round(years*12)), r = annualRate/12;
  if(principal <= 0) return 0;
  if(r === 0) return principal/n;
  return principal*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
}
function principalFor(payment, annualRate, years){
  const n = Math.max(1, Math.round(years*12)), r = annualRate/12;
  if(payment <= 0) return 0;
  if(r === 0) return payment*n;
  return payment*(Math.pow(1+r,n)-1)/(r*Math.pow(1+r,n));
}
function compute(f){
  const n = k => { const v = parseFloat(f[k]); return Number.isFinite(v) ? (PERCENT.has(k) ? v/100 : v) : 0; };
  const price=n('price'), close=n('close'), rehab=n('rehab'), hold=n('hold'), carry=n('carry');
  const arv=n('arv'), ltv=n('ltv'), rate=n('rate'), amort=n('amort'), reficlose=n('reficlose'), minDscr=n('dscr');
  const rent=n('rent'), vac=n('vac'), maint=n('maint'), capex=n('capex'), mgmt=n('mgmt'), ti=n('ti');
  const maxleft=n('maxleft'); const basis = f.basis === 'lender' ? 'lender' : 'noi';

  const holding = hold*carry;
  const allIn = price+close+rehab+holding;

  const gross = rent*12, vacancy = gross*vac, egi = gross-vacancy;
  const mnt = gross*maint, cpx = gross*capex, mg = gross*mgmt;
  const opex = mnt+cpx+mg+ti, noi = egi-opex;

  const loanByLtv = Math.max(0, arv*ltv);
  let maxPi = Infinity;
  if(minDscr > 0){
    maxPi = basis === 'lender' ? rent/minDscr - ti/12 : noi/minDscr/12;
    maxPi = Math.max(0, maxPi);
  }
  const loanByDscr = Number.isFinite(maxPi) ? principalFor(maxPi, rate, amort) : Infinity;
  let loan, limiter;
  if(loanByLtv <= 0 && !(loanByDscr > 0)){ loan = 0; limiter = 'none'; }
  else if(loanByDscr < loanByLtv){ loan = loanByDscr; limiter = 'dscr'; }
  else { loan = loanByLtv; limiter = 'ltv'; }

  const net = loan - reficlose;
  const cashLeft = allIn - net;
  const equity = arv - loan;
  const payment = pmt(loan, rate, amort), ads = payment*12;
  const cf = (noi-ads)/12;
  let dscr = null;
  if(ads > 0) dscr = basis === 'lender' ? gross/(ads+ti) : noi/ads;
  const coc = cashLeft > 0 ? cf*12/cashLeft : null;
  const cap = allIn > 0 ? noi/allIn : null;
  const maoRaw = net + maxleft - close - rehab - holding;

  return {price, close, rehab, hold, carry, arv, ltv, rate, amort, reficlose, minDscr, rent, vac, maint, capex, mgmt, ti, maxleft, basis,
    holding, allIn, gross, vacancy, egi, mnt, cpx, mg, opex, noi,
    loanByLtv, loanByDscr: Number.isFinite(loanByDscr) ? loanByDscr : loanByLtv, limiter, loan, net, cashLeft, equity, payment, ads,
    cf, dscr, coc, cap, mao: Math.max(0, maoRaw), priceVsMao: price - maoRaw};
}

// Thresholds mirror the grading constants in defaults.py.
function tones(r){
  return {
    cashLeft: r.cashLeft <= r.maxleft + 0.5 ? 'good' : r.cashLeft <= 30000 ? 'warn' : 'bad',
    cf: r.cf >= 300 ? 'good' : r.cf >= 100 ? 'warn' : 'bad',
    dscr: r.dscr == null ? 'neutral' : r.dscr >= 1.25 ? 'good' : r.dscr >= 1.1 ? 'warn' : 'bad',
    price: r.priceVsMao <= 0.5 ? 'good' : r.priceVsMao <= 10000 ? 'warn' : 'bad'
  };
}

// ── Formatting ────────────────────────────────────────────────────────────────
const money = n => (n < -0.5 ? '−' : '') + '$' + Math.round(Math.abs(n)).toLocaleString('en-US');
const pct = (n, d=1) => n == null ? '—' : (n*100).toFixed(d) + '%';
const ratio = n => n == null ? '—' : n.toFixed(2) + '×';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ── State + URL ───────────────────────────────────────────────────────────────
let form = Object.assign({}, DEFAULTS);
for(const k in form) form[k] = String(form[k]);

function readUrl(){
  const q = new URLSearchParams(location.search);
  for(const k in DEFAULTS){
    if(!q.has(k)) continue;
    const v = q.get(k);
    if(k === 'basis'){ if(v === 'noi' || v === 'lender') form.basis = v; continue; }
    if(Number.isFinite(parseFloat(v))) form[k] = v;
  }
}
function writeUrl(){
  const q = new URLSearchParams();
  for(const k in DEFAULTS){
    if(k === 'basis'){ if(form.basis !== DEFAULTS.basis) q.set(k, form.basis); continue; }
    const v = parseFloat(form[k]);
    if(!Number.isFinite(v) || v === DEFAULTS[k]) continue;
    q.set(k, String(Math.round(v*1000)/1000));
  }
  const qs = q.toString();
  history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
}

// ── Render ────────────────────────────────────────────────────────────────────
const $inputs = document.getElementById('inputs');
const $results = document.getElementById('results');
const $sticky = document.getElementById('sticky');

function renderInputs(){
  $inputs.innerHTML = SECTIONS.map(s => `
    <section>
      <h3>${esc(s.title)}</h3>
      <div class="fields">
        ${s.fields.map(f => `
          <div class="field">
            <label for="f-${f.k}">${esc(f.label)}</label>
            <div class="ctl">
              ${f.unit === '$' ? '<span>$</span>' : ''}
              <input id="f-${f.k}" data-k="${f.k}" type="number" inputmode="decimal" step="${f.step}" value="${esc(form[f.k])}">
              ${f.unit !== '$' ? `<span>${esc(f.unit)}</span>` : ''}
            </div>
            ${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}
          </div>`).join('')}
        ${s.basis ? `
          <div class="sel">
            <label for="f-basis">DSCR measured as</label>
            <select id="f-basis" data-k="basis">
              <option value="noi"${form.basis==='noi'?' selected':''}>NOI ÷ P&amp;I (conservative)</option>
              <option value="lender"${form.basis==='lender'?' selected':''}>Gross rent ÷ PITI (lender style)</option>
            </select>
            <div class="hint" id="basis-hint"></div>
          </div>` : ''}
      </div>
    </section>`).join('') + `
    <div class="foot">Defaults are conservative Rochester, NY assumptions from the BBR deal bot. ARV is what the refi appraiser will say, not what the listing hopes for.</div>`;
  updateBasisHint();
}
function updateBasisHint(){
  const h = document.getElementById('basis-hint');
  if(h) h.textContent = form.basis === 'lender'
    ? 'How most DSCR lenders qualify a 1–4 unit rental. Reserves are ignored, so the loan can be larger than the conservative basis supports.'
    : 'Vacancy, maintenance, CapEx and management come off the top first.';
}

function row(label, value, opts={}){
  const cls = [opts.indent?'indent':'', opts.strong?'strong':''].filter(Boolean).join(' ');
  return `<tr class="${cls}"><td>${label}</td><td class="num ${opts.tone||''}">${value}</td></tr>`;
}
function tile(label, value, sub, tone){
  return `<div class="tile"><div class="label">${label}</div><div class="v num ${tone||''}">${value}</div><div class="s">${sub||''}</div></div>`;
}

function renderResults(){
  const r = compute(form), t = tones(r);
  const over = r.priceVsMao > 0.5, under = r.priceVsMao < -0.5;
  const priceMsg = over ? `Your price is ${money(r.priceVsMao)} above the max offer`
                 : under ? `Your price is ${money(-r.priceVsMao)} below the max offer`
                 : 'Your price is right at the max offer';

  // Sensitivity: ARV ±10%
  const sens = [0.9,0.95,1,1.05,1.1].map(m => {
    const rr = compute(Object.assign({}, form, {arv: String(r.arv*m)}));
    return {m, rr, tt: tones(rr)};
  });

  $results.innerHTML = `
    <div class="card">
      <div class="head">
        <div>
          <div class="label">Max offer (BRRRR)</div>
          <div class="big num">${money(r.mao)}</div>
          <div class="sub">Leaves no more than ${money(r.maxleft)} in the deal after the refi.</div>
        </div>
        <span class="badge ${t.price}">${priceMsg}</span>
      </div>
      <div class="tiles">
        ${tile(r.cashLeft < -0.5 ? 'Cash pulled out' : 'Cash left in', money(Math.abs(r.cashLeft)), r.cashLeft < -0.5 ? 'more than you put in' : `of ${money(r.allIn)} all-in`, t.cashLeft)}
        ${tile('Cash flow / mo', money(r.cf), 'after refi P&amp;I and reserves', t.cf)}
        ${tile('DSCR', ratio(r.dscr), r.basis === 'lender' ? 'rent ÷ PITI' : 'NOI ÷ P&amp;I', t.dscr)}
        ${tile('Cash-on-cash', r.coc == null ? '∞' : pct(r.coc), r.coc == null ? 'all capital returned' : 'annual CF ÷ cash left in', r.coc == null ? 'good' : r.coc >= 0.1 ? 'good' : r.coc >= 0 ? 'warn' : 'bad')}
        ${tile('Equity after refi', money(r.equity), `${pct(r.arv > 0 ? r.equity/r.arv : null, 0)} of ARV`)}
        ${tile('Cap rate', pct(r.cap), 'NOI ÷ all-in cost')}
      </div>
      ${r.limiter === 'dscr' ? `
        <div class="note warn"><b>Rent is capping the loan, not the appraisal.</b>
        At ${ratio(r.minDscr)} coverage the rent supports a ${money(r.loanByDscr)} loan, while ${pct(r.ltv,0)} of ARV would allow ${money(r.loanByLtv)}.
        More rent, a lower rate, or a lender with a lower DSCR floor raises the max offer; a higher appraisal does not.</div>` : ''}
      ${r.limiter === 'ltv' && r.minDscr > 0 ? `
        <div class="note quiet">Loan sized by LTV at ${money(r.loanByLtv)}; the rent would support up to ${money(r.loanByDscr)} at ${ratio(r.minDscr)} coverage.</div>` : ''}
    </div>

    <div class="card cols">
      <section>
        <h3>Buy &amp; rehab</h3>
        <table>
          ${row('Purchase price', money(r.price))}
          ${row('Closing & acquisition', money(r.close))}
          ${row('Rehab', money(r.rehab))}
          ${row(`Holding (${r.hold} mo × ${money(r.carry)})`, money(r.holding))}
          ${row('All-in cost', money(r.allIn), {strong:true})}
        </table>
        <h3 style="margin-top:18px">Refinance</h3>
        <table>
          ${row('After-repair value', money(r.arv))}
          ${row(`Loan at ${pct(r.ltv,0)} LTV`, money(r.loanByLtv), {indent:true, tone: r.limiter==='ltv'?'':'warn'})}
          ${r.minDscr > 0 ? row(`Loan at ${ratio(r.minDscr)} DSCR`, money(r.loanByDscr), {indent:true, tone: r.limiter==='dscr'?'warn':''}) : ''}
          ${row('Refi loan (lesser of the two)', money(r.loan), {strong:true})}
          ${row('Refi closing costs', '− ' + money(r.reficlose))}
          ${row('Net proceeds', money(r.net), {strong:true})}
          ${row('Cash left in', money(r.cashLeft), {strong:true, tone:t.cashLeft})}
          ${row('Equity after refi', money(r.equity))}
          ${row(`Monthly P&amp;I (${pct(r.rate,3)}, ${r.amort} yr)`, money(r.payment))}
        </table>
      </section>
      <section>
        <h3>Operating (annual)</h3>
        <table>
          ${row('Gross rent', money(r.gross))}
          ${row(`Vacancy (${pct(r.vac,0)})`, '− ' + money(r.vacancy), {indent:true})}
          ${row('Effective gross income', money(r.egi), {strong:true})}
          ${row(`Maintenance (${pct(r.maint,0)})`, '− ' + money(r.mnt), {indent:true})}
          ${row(`CapEx (${pct(r.capex,0)})`, '− ' + money(r.cpx), {indent:true})}
          ${row(`Management (${pct(r.mgmt,0)})`, '− ' + money(r.mg), {indent:true})}
          ${row('Taxes + insurance', '− ' + money(r.ti), {indent:true})}
          ${row('Net operating income', money(r.noi), {strong:true})}
          ${row('Debt service', '− ' + money(r.ads), {indent:true})}
          ${row('Annual cash flow', money(r.cf*12), {strong:true, tone:t.cf})}
          ${row('Monthly cash flow', money(r.cf), {tone:t.cf})}
          ${row('DSCR', ratio(r.dscr), {tone:t.dscr})}
          ${row('Cap rate on all-in', pct(r.cap))}
        </table>
      </section>
    </div>

    <div class="card">
      <h3>If the appraisal comes in differently</h3>
      <div class="sub" style="margin:-4px 0 10px">Same deal, ARV moved ±10%. Everything else held constant.</div>
      <div class="sens"><table>
        <thead><tr><th>ARV</th><th>Refi loan</th><th>Cash left in</th><th>Max offer</th><th>CF / mo</th><th>DSCR</th></tr></thead>
        <tbody>${sens.map(s => `
          <tr class="num${s.m===1?' base':''}">
            <td>${money(s.rr.arv)}<span class="pct">${s.m===1?'(base)':`(${s.m>1?'+':'−'}${Math.round(Math.abs(s.m-1)*100)}%)`}</span></td>
            <td>${money(s.rr.loan)}</td>
            <td class="${s.tt.cashLeft}">${money(s.rr.cashLeft)}</td>
            <td>${money(s.rr.mao)}</td>
            <td class="${s.tt.cf}">${money(s.rr.cf)}</td>
            <td class="${s.tt.dscr}">${ratio(s.rr.dscr)}</td>
          </tr>`).join('')}
        </tbody>
      </table></div>
      ${r.limiter === 'dscr' ? '<div class="hint" style="margin-top:8px">Rows look flat because the rent, not the appraisal, is sizing the loan right now.</div>' : ''}
    </div>`;

  $sticky.innerHTML = `
    <div class="card">
      <div><div class="label">Max offer</div><div class="big num">${money(r.mao)}</div></div>
      <span class="badge ${t.price}">${over ? money(r.priceVsMao)+' over' : under ? money(-r.priceVsMao)+' under' : 'at max'}</span>
      <div class="mini num">
        <div><span>${r.cashLeft < -0.5 ? 'Cash out' : 'Left in'}</span><b class="${t.cashLeft}">${money(Math.abs(r.cashLeft))}</b></div>
        <div><span>CF / mo</span><b class="${t.cf}">${money(r.cf)}</b></div>
        <div><span>DSCR</span><b class="${t.dscr}">${ratio(r.dscr)}</b></div>
      </div>
    </div>`;
  postHeight();
}

// ── Events ────────────────────────────────────────────────────────────────────
$inputs.addEventListener('input', e => {
  const k = e.target.dataset.k; if(!k) return;
  form[k] = e.target.value;
  if(k === 'basis') updateBasisHint();
  writeUrl(); renderResults();
});
document.getElementById('reset').addEventListener('click', () => {
  form = Object.assign({}, DEFAULTS); for(const k in form) form[k] = String(form[k]);
  renderInputs(); writeUrl(); renderResults();
});
document.getElementById('copy').addEventListener('click', async () => {
  const b = document.getElementById('copy');
  try{ await navigator.clipboard.writeText(location.href); b.textContent = 'Copied!'; }
  catch(e){ b.textContent = 'Copy failed'; }
  setTimeout(() => { b.textContent = 'Copy link'; }, 1400);
});

// ── Embed support: tell an iframe host how tall we are ────────────────────────
function postHeight(){
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
  const msg = {src: location.href, context: 'iframe.resize', height: h};
  try{ window.parent.postMessage(msg, '*'); }catch(e){}
  try{ window.parent.postMessage(JSON.stringify(msg), '*'); }catch(e){}
}
window.addEventListener('load', postHeight);
window.addEventListener('resize', postHeight);

readUrl();
renderInputs();
renderResults();
})();
</script>
</body>
</html>
